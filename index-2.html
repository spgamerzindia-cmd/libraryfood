<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
   <title>library Food </title>
   <style>
      :root {
         box-sizing: border-box;
         padding-top: env(safe-area-inset-top, 0px);
         padding-bottom: env(safe-area-inset-bottom, 0px);
         --bg: #f6f7f9;
         --fg: #1a1d21;
         --card: #fff;
         --pri: #16803c;
         --prit: #fff;
         --mut: #6b7280;
         --bd: #e3e6ea;
         --err: #c62828
      }

      @media (prefers-color-scheme:dark) {
         :root:not([data-theme="light"]) {
            --bg: #111418;
            --fg: #eceef1;
            --card: #1b1f25;
            --pri: #3ecf72;
            --prit: #062b14;
            --mut: #9aa3ad;
            --bd: #2b3139;
            --err: #ff8a80
         }
      }

      :root[data-theme="dark"] {
         --bg: #111418;
         --fg: #eceef1;
         --card: #1b1f25;
         --pri: #3ecf72;
         --prit: #062b14;
         --mut: #9aa3ad;
         --bd: #2b3139;
         --err: #ff8a80
      }

      html { scroll-padding-top: env(safe-area-inset-top, 0px) }
      * { box-sizing: border-box }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
      #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 96px }
      h1 { font-size: 22px; margin: 6px 0 4px }
      h2 { font-size: 14px; color: var(--mut); text-transform: uppercase; letter-spacing: .04em; margin: 20px 0 8px }
      .card { background: var(--card); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; margin-bottom: 10px }
      .row { display: flex; align-items: center; gap: 10px }
      .sp { justify-content: space-between }
      .grow { flex: 1; min-width: 0 }
      .mut { color: var(--mut); font-size: 14px }
      button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--pri); color: var(--prit); font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center }
      button.alt { background: transparent; color: var(--fg); border: 1px solid var(--bd) }
      button.sm { padding: 6px 12px }
      button.red { background: transparent; color: var(--err); border: 1px solid var(--bd) }
      .full { width: 100% }
      input, select { font: inherit; width: 100%; padding: 10px; border: 1px solid var(--bd); border-radius: 8px; background: var(--bg); color: var(--fg) }
      label { display: block; font-size: 14px; color: var(--mut); margin: 10px 0 4px }
      .pic { width: 56px; height: 56px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; flex: none }
      .pic img { width: 100%; height: 100%; object-fit: cover }
      .qty { display: flex; align-items: center; gap: 10px }
      .qty button { width: 34px; height: 34px; padding: 0; font-size: 20px }
      .qty b { min-width: 18px; text-align: center }
      .off { opacity: .45 }
      .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--bd) }
      .bar .in { max-width: 560px; margin: 0 auto }
      .err { background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 14px }
      .tot { display: flex; justify-content: space-between; padding: 3px 0 }
      .tot.g { font-weight: 700; font-size: 18px; border-top: 1px solid var(--bd); margin-top: 6px; padding-top: 8px }
      .tabs { display: flex; gap: 8px; margin: 8px 0 }
      .tabs button { flex: 1; padding: 9px }
      .ok { text-align: center; padding: 40px 10px }
      .ok .big { font-size: 64px }
      a.lnk { color: var(--mut); font-size: 13px; background: none; border: 0; text-decoration: underline; cursor: pointer }
      .warn { color: var(--err); font-size: 13px; margin-top: 4px }
   </style>
</head>

      const K = 'lib_mvp_v1', VER = 3, CATS = ['Biscuits', 'Chips & Snacks', 'Hot Snacks', 'Cold Drinks / Juice', 'Water', 'Other'];
      /* [name, price (0 = abhi set nahi, customer ko nahi dikhega), category, emoji, image key] */
      const PRODUCTS = [
         ['Parle-G', 5, 'Biscuits', '🍪', 'parleg'],
         ['Tiger Glucose', 0, 'Biscuits', '🍪', 'tiger'],
         ['Bourbon', 0, 'Biscuits', '🍫', 'bourbon'],
         ['Hide & Seek', 0, 'Biscuits', '🍫', 'hide'],
         ['Oreo', 0, 'Biscuits', '🍪', 'oreo'],
         ['Jim Jam', 0, 'Biscuits', '🍪', 'jimjam'],
         ['Magix Elaichi', 0, 'Biscuits', '🍪', 'magix'],
         ['Good Day', 10, 'Biscuits', '🍪', ''],
         ['Kurkure Masala Munch', 10, 'Chips & Snacks', '🥨', 'kurkure'],
         ['Lays India\'s Magic Masala', 10, 'Chips & Snacks', '🥔', 'lmagic'],
         ['Lays Classic', 0, 'Chips & Snacks', '🥔', 'lclassic'],
         ['Bingo Mad Angles Mummm Masala', 0, 'Chips & Snacks', '🔺', 'mummm'],
         ['Bingo Mad Angles Achaari Masti', 0, 'Chips & Snacks', '🔺', 'achaari'],
         ['Balaji Punjabi Tadka', 0, 'Chips & Snacks', '🥨', 'tadka'],
         ['Balaji Masala Sev Murmura', 0, 'Chips & Snacks', '🥨', 'murmura'],
         ['Parle Namkeen Hot n Spicy', 0, 'Chips & Snacks', '🥨', 'namkeen'],
         ['Haldiram\'s Plain Bhujia', 0, 'Chips & Snacks', '🥨', 'bhujia'],
         ['Roasted Chana', 0, 'Chips & Snacks', '🌰', 'chana'],
         ['Samosa', 0, 'Hot Snacks', '🥟', 'samosa'],
         ['Momos', 0, 'Hot Snacks', '🥟', 'momos'],
         ['Dairy Milk', 0, 'Other', '🍫', ''],
         ['5 Star', 0, 'Other', '🍫', ''],
         ['Kit Kat', 0, 'Other', '🍫', ''],
         ['Maggi Cup Noodles', 0, 'Hot Snacks', '🍜', ''],
         ['Frooti', 0, 'Cold Drinks / Juice', '🧃', ''],
         ['Sprite', 0, 'Cold Drinks / Juice', '🥤', ''],
         ['Coca-Cola', 0, 'Cold Drinks / Juice', '🥤', ''],
         ['Water Bottle', 10, 'Water', '💧', ''],
         ['Juice', 20, 'Cold Drinks / Juice', '🧃', ''],
         ['Cold Drink', 20, 'Cold Drinks / Juice', '🥤', '']
      ].map((p, i) => ({ id: 'p' + i, name: p[0], price: p[1], cat: p[2], emoji: p[3], img: IMG[p[4]] || '', on: true }));
      const seed = () => ({
         ver: VER, settings: { delivery: 20, wa: '917897275614', pin: '1234' }, seq: 1000,
         libs: [{ id: 'l1', name: 'Central Study Library', address: 'Near Main Chowk (admin me edit karo)' }, { id: 'l2', name: 'Scholars Library', address: 'Sample address 2' }, { id: 'l3', name: 'Knowledge Hub Library', address: 'Sample address 3' }],
         products: PRODUCTS.map(p => ({ ...p }))
      });
      const load = () => {
         try {
            const d = JSON.parse(localStorage.getItem(K));
            if (!d) return seed();
            if ((d.ver || 1) < 2) { d.products = seed().products } /* purana demo data -> nayi image wali list */
            else if (d.ver < VER) { const have = new Set(d.products.map(p => p.name)); seed().products.forEach(p => { if (!have.has(p.name)) d.products.push({ ...p, id: 'p' + Date.now() + p.id }) }) } /* aapke edit kiye product safe, sirf naye add */
            d.ver = VER;
            return d;
         } catch (e) { return seed() }
      };
      const save = () => { try { localStorage.setItem(K, JSON.stringify(D)) } catch (e) { alert('Storage full - kuch product/image delete karo') } };
      let D = load();
      if (!D.settings.wa || D.settings.wa === '919999999999') { D.settings.wa = '917897275614' }
      save();

      /* ============ NOTIFY LAYER ============
         Abhi: WhatsApp click-to-send (free). Future: yahan WhatsApp Business API call daalo. */
      const Notify = {
         text(o) {
            const L = o.items.map(i => `${i.name} × ${i.qty} = ₹${i.qty * i.price}`).join('\n\n');
            return `🛒 NEW ORDER\n\n📚 Library: ${o.lib}\n\n👤 Customer: ${o.name}\n\n📱 Mobile: ${o.mobile}\n\n🛍️ ORDER:\n${L}\n\n💵 Product Total: ₹${o.sub}\n\n🚚 Delivery Charge: ₹${o.delivery}\n\n💰 TOTAL: ₹${o.total}\n\nOrder ID: #${o.id}`;
         },
         num() { let n = String(D.settings.wa || '').replace(/\D/g, ''); if (n.length === 10) n = '91' + n; return n },
         url(o) { return 'https://wa.me/' + this.num() + '?text=' + encodeURIComponent(this.text(o)) }
      };

      /* ============ HELPERS ============ */
      const $ = document.getElementById('app'), rs = n => '₹' + n;
      const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      let S = { v: 'lib', lib: null, cart: {}, name: '', mobile: '', err: '', order: null, tab: 'p' };
      const go = v => { S.v = v; S.err = ''; render(); scrollTo(0, 0) };
      const pic = p => `<div class="pic">${p.img ? `<img src="${p.img}" alt="">` : esc(p.emoji || '🛍️')}</div>`;
      const items = () => D.products.filter(p => S.cart[p.id] > 0 && p.on && p.price > 0).map(p => ({ name: p.name, price: p.price, qty: S.cart[p.id] }));
      const sums = () => { const it = items(), sub = it.reduce((a, i) => a + i.qty * i.price, 0); return { it, sub, n: it.reduce((a, i) => a + i.qty, 0) } };

      /* ============ CUSTOMER VIEWS ============ */
      function vLib() {
         return `<h1>📚 Select Your Library</h1><div class="mut">Apni library chuno, snacks seedhe wahin deliver honge.</div><h2>Libraries</h2>` +
            (D.libs.length ? D.libs.map(l => `<div class="card"><button class="full" onclick="pick('${l.id}')">${esc(l.name)}</button>${l.address ? `<div class="mut" style="margin-top:6px">📍 ${esc(l.address)}</div>` : ''}</div>`).join('') : '<div class="card mut">Abhi koi library nahi hai.</div>') +
            `<p style="text-align:center;margin-top:30px"><button class="lnk a" onclick="adminLogin()" style="all:unset"></button><a class="lnk" onclick="adminLogin()">Admin</a></p>`;
      }
      function vShop() {
         const lib = D.libs.find(l => l.id === S.lib), m = sums();
         let h = `<div class="row sp"><div><h1>${esc(lib.name)}</h1><div class="mut">Delivery: ${rs(D.settings.delivery)}</div></div><button class="alt sm" onclick="go('lib')">Change</button></div>`;
         CATS.forEach(c => {
            const ps = D.products.filter(p => p.cat === c && p.price > 0); if (!ps.length) return; /* price 0 wale customer ko nahi dikhte */
            h += `<h2>${esc(c)}</h2>` + ps.map(p => `<div class="card row ${p.on ? '' : 'off'}">${pic(p)}<div class="grow"><b>${esc(p.name)}</b><div class="mut">${rs(p.price)}${p.on ? '' : ' · Unavailable'}</div></div>${p.on ? `<div class="qty"><button class="alt" onclick="q('${p.id}',-1)">−</button><b>${S.cart[p.id] || 0}</b><button onclick="q('${p.id}',1)">+</button></div>` : ''}</div>`).join('');
         });
         h += `<div class="bar"><div class="in">${m.n ? `<button class="full" onclick="go('co')">🛒 ${m.n} item${m.n > 1 ? 's' : ''} · ${rs(m.sub)} — View Cart</button>` : `<div class="mut" style="text-align:center;padding:10px">Cart khaali hai — items add karo</div>`}</div></div>`;
         return h;
      }
      function vCo() {
         const lib = D.libs.find(l => l.id === S.lib), m = sums(), dc = D.settings.delivery;
         return `<button class="alt sm" onclick="go('shop')">← Back</button><h1>Checkout</h1>` +
            (S.err ? `<div class="err">${esc(S.err)}</div>` : '') +
            `<div class="card"><label style="margin-top:0">Customer Name</label><input value="${esc(S.name)}" oninput="S.name=this.value" placeholder="Aapka naam" autocomplete="name">
 <label>Mobile Number</label><input value="${esc(S.mobile)}" oninput="S.mobile=this.value" inputmode="numeric" maxlength="14" placeholder="10 digit number" autocomplete="tel">
 <label>Library</label><input value="${esc(lib.name)}" readonly></div>
 <h2>Your Order</h2><div class="card">`+
            (m.it.length ? m.it.map(i => `<div class="tot"><span>${esc(i.name)} × ${i.qty}</span><span>${rs(i.qty * i.price)}</span></div>`).join('') : '<div class="mut">Koi item nahi</div>') +
            `<div class="tot" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><span>Product Total</span><span>${rs(m.sub)}</span></div>
 <div class="tot"><span>Delivery Charge</span><span>${rs(dc)}</span></div>
 <div class="tot g"><span>Grand Total</span><span>${rs(m.sub + dc)}</span></div></div>
 <div class="bar"><div class="in"><button class="full" onclick="place()">✅ Place Order — ${rs(m.sub + dc)}</button></div></div>`;
      }
      function vDone() {
         const o = S.order;
         return `<div class="ok"><div class="big">✅</div><h1>Order Received!</h1><p>Your order has been received. We will deliver it to your library.</p><p class="mut">Order ID: #${o.id}</p>
 <p><a class="btn" href="${esc(Notify.url(o))}" target="_blank" rel="noopener">📲 Send on WhatsApp</a></p>
 <p class="mut" style="font-size:13px">WhatsApp nahi khula? Upar wala button dabao aur Send karo.</p>
 <button class="alt" onclick="S.cart={};go('shop')">Naya order</button></div>`;
      }

      /* ============ CUSTOMER ACTIONS ============ */
      function pick(id) { S.lib = id; go('shop') }
      function q(id, d) { S.cart[id] = Math.max(0, (S.cart[id] || 0) + d); render() }
      function place() {
         const m = sums(), mob = S.mobile.replace(/\D/g, '').replace(/^(91|0)(?=\d{10}$)/, '');
         if (!S.name.trim()) return fail('Please enter your name.');
         if (!/^[6-9]\d{9}$/.test(mob)) return fail('Please enter a valid 10-digit mobile number.');
         if (!S.lib) return fail('Please select a library.');
         if (!m.it.length) return fail('Please add at least one product.');
         const dc = D.settings.delivery; D.seq++; save();
         const o = { id: D.seq, lib: D.libs.find(l => l.id === S.lib).name, name: S.name.trim(), mobile: mob, items: m.it, sub: m.sub, delivery: dc, total: m.sub + dc };
         S.order = o; S.cart = {}; go('done');
         try { window.open(Notify.url(o), '_blank') } catch (e) { }
      }
      function fail(m) { S.err = m; render(); scrollTo(0, 0) }

      /* ============ ADMIN ============ */
      function adminLogin() { const p = prompt('Admin PIN'); if (p === null) return; if (p === D.settings.pin) { S.tab = 'p'; go('admin') } else alert('Wrong PIN') }
      function up(id, k, v) { const p = D.products.find(x => x.id === id); p[k] = k === 'price' ? Math.max(0, +v || 0) : v; save() }
      function upl(id, k, v) { const l = D.libs.find(x => x.id === id); l[k] = v; save() }
      function tog(id, v) { up(id, 'on', v); render() }
      function delP(id) { if (confirm('Delete product?')) { D.products = D.products.filter(p => p.id !== id); save(); render() } }
      function delL(id) { if (confirm('Delete library?')) { D.libs = D.libs.filter(p => p.id !== id); save(); render() } }
      function addP() { const n = document.getElementById('np').value.trim(), pr = +document.getElementById('npr').value; if (!n) return alert('Name likho'); D.products.push({ id: 'p' + Date.now(), name: n, price: Math.max(0, pr || 0), cat: document.getElementById('nc').value, emoji: '🛍️', img: '', on: true }); save(); render() }
      function addL() { const n = document.getElementById('nl').value.trim(); if (!n) return alert('Library ka naam likho'); D.libs.push({ id: 'l' + Date.now(), name: n, address: document.getElementById('na').value.trim() }); save(); render() }

      /* image -> chhota (180px) square JPEG data-URL */
      function shrink(file) {
         return new Promise((ok, no) => {
            const r = new FileReader();
            r.onerror = no;
            r.onload = () => {
               const i = new Image(); i.onerror = no;
               i.onload = () => {
                  const N = 180, s = Math.min(N / i.width, N / i.height, 1), w = Math.round(i.width * s), h = Math.round(i.height * s);
                  const c = document.createElement('canvas'); c.width = N; c.height = N;
                  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, N, N);
                  x.drawImage(i, (N - w) / 2, (N - h) / 2, w, h);
                  ok(c.toDataURL('image/jpeg', .78));
               };
               i.src = r.result;
            };
            r.readAsDataURL(file);
         });
      }
      /* ek product ki image badlo */
      async function img(id, inp) {
         const f = inp.files[0]; if (!f) return;
         try { up(id, 'img', await shrink(f)); render() } catch (e) { alert('Image nahi khuli, dusri try karo') }
      }
      /* BULK ADD: bahut saari photos ek saath -> har photo ka ek product (naam file ke naam se, price 0) */
      async function bulk(inp) {
         const fs = [...inp.files]; if (!fs.length) return;
         const cat = document.getElementById('bc').value; let n = 0;
         for (const f of fs) {
            try {
               const name = f.name.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ').trim() || 'New product';
               D.products.push({ id: 'p' + Date.now() + n, name, price: 0, cat, emoji: '🛍️', img: await shrink(f), on: true }); n++;
            } catch (e) { }
         }
         save(); render();
         alert(n + ' product add hue. Ab har ek ka naam aur price set karo (price 0 wale customer ko nahi dikhte).');
      }
      function setS(k, v) { D.settings[k] = k === 'delivery' ? Math.max(0, +v || 0) : k === 'wa' ? v.replace(/\D/g, '') : v.trim(); save(); if (k === 'wa') { const e = document.getElementById('wast'); if (e) e.textContent = waStat() } }
      function waStat() { const n = Notify.num(); return n.length < 12 ? '⚠️ Number adhoora hai (91 + 10 digit chahiye)' : n === '919999999999' ? '⚠️ Ye demo number hai, apna number daalo' : '✅ Orders yahan jayenge: +' + n }
      function testWA() { const o = { id: 0, lib: 'TEST', name: 'Test', mobile: '0000000000', items: [{ name: 'Parle-G', qty: 1, price: 5 }], sub: 5, delivery: D.settings.delivery, total: 5 + D.settings.delivery }; const w = window.open(Notify.url(o), '_blank'); if (!w) alert('Popup block hua. Browser me popups allow karo.') }
      function vAdmin() {
         let h = `<div class="row sp"><h1>⚙️ Admin</h1><button class="alt sm" onclick="go('lib')">Exit</button></div>
 <div class="tabs">${[['p', 'Products'], ['l', 'Libraries'], ['s', 'Settings']].map(t => `<button class="${S.tab === t[0] ? '' : 'alt'}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
         if (S.tab === 'p') {
            const nz = D.products.filter(p => !(p.price > 0)).length;
            h += `<div class="card"><b>📷 Photos se bulk add</b><div class="mut">Ek saath kitni bhi photos chuno. Har photo ka ek product banega (photo ke naam se, price 0). Baad me naam/price badlo.</div>
  <label>Category</label><select id="bc">${CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select><label>Photos</label><input type="file" accept="image/*" multiple onchange="bulk(this)"></div>`;
            h += `<div class="card"><b>➕ Add product</b><label>Name</label><input id="np"><label>Price (₹)</label><input id="npr" type="number" inputmode="numeric"><label>Category</label><select id="nc">${CATS.map(c => `<option>${esc(c)}</option>`).join('')}</select><br><br><button class="full" onclick="addP()">Add</button></div>`;
            if (nz) h += `<div class="err">${nz} product ka price set nahi hai — wo customer ko nahi dikh rahe.</div>`;
            h += D.products.map(p => `<div class="card"><div class="row">${pic(p)}<div class="grow"><input value="${esc(p.name)}" onchange="up('${p.id}','name',this.value)"></div></div>
  <div class="row" style="margin-top:8px"><div class="grow"><label style="margin:0">Price ₹</label><input type="number" inputmode="numeric" value="${p.price}" onchange="up('${p.id}','price',this.value);render()"></div>
  <div class="grow"><label style="margin:0">Category</label><select onchange="up('${p.id}','cat',this.value)">${CATS.map(c => `<option ${c === p.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div></div>
  ${p.price > 0 ? '' : '<div class="warn">⚠️ Price set karo, tabhi customer ko dikhega</div>'}
  <label>Image</label><input type="file" accept="image/*" onchange="img('${p.id}',this)">
  <div class="row sp" style="margin-top:10px"><label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${p.on ? 'checked' : ''} onchange="tog('${p.id}',this.checked)"> Available</label><button class="red sm" onclick="delP('${p.id}')">Delete</button></div></div>`).join('');
         }
         if (S.tab === 'l') {
            h += `<div class="card"><b>➕ Add library</b><label>Name</label><input id="nl"><label>Address / Location</label><input id="na"><br><br><button class="full" onclick="addL()">Add</button></div>`;
            h += D.libs.map(l => `<div class="card"><label style="margin-top:0">Name</label><input value="${esc(l.name)}" onchange="upl('${l.id}','name',this.value)"><label>Address (sirf aapko dikhega WhatsApp/delivery ke liye)</label><input value="${esc(l.address)}" onchange="upl('${l.id}','address',this.value)"><br><br><button class="red sm" onclick="delL('${l.id}')">Delete</button></div>`).join('');
         }
         if (S.tab === 's') {
            h += `<div class="card"><label style="margin-top:0">Delivery Charge (₹)</label><input type="number" inputmode="numeric" value="${D.settings.delivery}" onchange="setS('delivery',this.value)">
  <label>Your WhatsApp number (91 ke saath, e.g. 919876543210)</label><input inputmode="numeric" value="${esc(D.settings.wa)}" oninput="setS('wa',this.value)" placeholder="919876543210"><div class="mut" id="wast" style="margin-top:6px">${waStat()}</div><br><button class="alt full" onclick="testWA()">📲 Test WhatsApp message</button>
  <label>Admin PIN</label><input value="${esc(D.settings.pin)}" onchange="setS('pin',this.value)"></div>
  <div class="mut">Saved automatically. Note: ye demo version data isi device ke browser me rakhta hai.</div>`;
         }
         return h;
      }

      function render() { $.innerHTML = { lib: vLib, shop: vShop, co: vCo, done: vDone, admin: vAdmin }[S.v]() }
      render();
   </script>
</body>
